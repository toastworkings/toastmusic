<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOAST VOL.1.2</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
<script>
  try { if (localStorage.getItem('toast_theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
</script>
<style>
  :root { --bg: #000; --fg: #fff; }
  :root[data-theme="light"] { --bg: #fff; --fg: #141416; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: flex; align-items: center; justify-content: center; font: 700 42px 'Poppins', sans-serif; }
</style>
</head>
<body>
  <h1 style="font: inherit; margin: 0;">Hello World</h1>
</body>
</html>
