<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toast</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    background-color: #000000;
    margin: 0;
    font-family: 'Poppins', sans-serif;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    color: #ffffff;
  }

  [hidden] { display: none !important; }

  /* ---------- MAIN VIEW ---------- */
  #main-view {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  #soundcloud-link img {
    width: 100px;
    transition: transform 0.1s ease-out;
  }

  #soundcloud-link img.clicked {
    transform: scale(1.1);
    transition: transform 0.1s ease-out;
  }

  #soundcloud-link img.reset {
    transform: scale(1);
    transition: transform 0.4s ease-out;
  }

  #soundcloud-link img:hover {
    transform: scale(1.05);
  }

  #who-is-toast {
    color: #ffffff;
    margin-top: 16px;
    font-size: 18px;
    font-weight: 400;
    cursor: pointer;
    transition: font-weight 0.15s ease-out;
  }

  #who-is-toast:hover {
    font-weight: 700;
  }

  #newest-release {
    margin-top: 40px;
    text-align: center;
    color: #ffffff;
  }

  #newest-release-label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #b3b3b3;
    margin-bottom: 10px;
  }

  #newest-release a {
    text-decoration: none;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #newest-release img {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
    transition: transform 0.2s ease-out;
  }

  #newest-release a:hover img {
    transform: scale(1.05);
  }

  #newest-release-title {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 400;
    transition: font-weight 0.15s ease-out;
  }

  #newest-release a:hover #newest-release-title {
    font-weight: 700;
  }

  /* ---------- SUBMIT BOX ---------- */
  #submit-box {
    margin-top: 40px;
    width: 300px;
    max-width: 85vw;
    text-align: center;
  }

  #blocked-msg {
    min-height: 18px;
    margin-bottom: 6px;
    font-size: 13px;
    color: #ff6b6b;
  }

  #submit-label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #b3b3b3;
    margin-bottom: 10px;
  }

  #submit-text {
    box-sizing: border-box;
    width: 100%;
    height: 80px;
    resize: none;
    background: #111111;
    color: #ffffff;
    border: 1px solid #333333;
    border-radius: 8px;
    padding: 10px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
    transition: border-color 0.15s ease-out;
  }

  #submit-text:focus {
    border-color: #777777;
  }

  #submit-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }

  #char-count {
    font-size: 12px;
    color: #777777;
  }

  #submit-btn {
    background: #ffffff;
    color: #000000;
    border: none;
    border-radius: 6px;
    padding: 6px 16px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s ease-out, opacity 0.15s ease-out;
  }

  #submit-btn:hover { transform: scale(1.05); }
  #submit-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  #submit-status {
    margin-top: 8px;
    min-height: 18px;
    font-size: 13px;
    color: #b3b3b3;
  }

  #submit-hint {
    margin-top: 14px;
    font-size: 10px;
    line-height: 1.5;
    color: #3a3a3a;
  }

  #submit-text:disabled { opacity: 0.6; }

  /* ---------- UNDO POPUP ---------- */
  #undo-popup {
    position: fixed;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    width: 170px;
    box-sizing: border-box;
    padding: 12px 14px 15px;
    background: #1a1a1a;
    color: #ffffff;
    border: 1px solid #555555;
    border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    line-height: 1.4;
    text-align: left;
    cursor: pointer;
    overflow: hidden;
    animation: undoIn 0.25s ease-out;
    user-select: none;
    -webkit-user-select: none;
  }

  #undo-popup:hover { background: #262626; }

  @media (max-width: 600px) {
    #undo-popup {
      right: 10px;
      left: 10px;
      top: auto;
      bottom: 14px;
      width: auto;
      transform: none;
    }

    @keyframes undoIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  }

  #undo-count {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    color: #999999;
  }

  #undo-bar {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 3px;
    background: #ffffff;
    transform-origin: left;
  }

  #undo-bar.run {
    transition-property: transform;
    transition-timing-function: linear;
    transform: scaleX(0);
  }

  @keyframes undoIn {
    from { opacity: 0; transform: translate(20px, -50%); }
    to   { opacity: 1; transform: translate(0, -50%); }
  }

  /* ---------- TOP TAB ---------- */
  @property --angle {
    syntax: '<angle>';
    inherits: false;
    initial-value: 0deg;
  }

  @keyframes tabSpin {
    to { --angle: 360deg; }
  }

  #tab-zone {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    height: 32px;
    z-index: 10;
  }

  #submissions-tab {
    --angle: 0deg;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 46px;
    transform: translateY(-26px);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0 0 7px;
    color: #ffffff;
    border: 2px solid transparent;
    border-top: none;
    border-radius: 0 0 12px 12px;
    background-image: linear-gradient(#222222, #222222), linear-gradient(#555555, #555555);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    box-shadow: 0 2px 12px rgba(255, 255, 255, 0.1);
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.2s ease-out;
    user-select: none;
    -webkit-user-select: none;
  }

  #tab-zone:hover #submissions-tab,
  #submissions-tab:focus-visible {
    transform: translateY(0);
    background-image:
      linear-gradient(#2a2a2a, #2a2a2a),
      conic-gradient(from var(--angle), #ff3b3b, #ffb000, #ffee00, #2bff5a, #00e5ff, #3b6bff, #c43bff, #ff3b9a, #ff3b3b);
    animation: tabSpin 2.5s linear infinite;
  }

  /* ---------- SUBMISSIONS VIEW ---------- */
  #submissions-view {
    min-height: 100vh;
    padding: 70px 20px 40px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #back-btn {
    position: fixed;
    top: 16px;
    left: 16px;
    background: #1a1a1a;
    color: #ffffff;
    border: 1px solid #333333;
    border-radius: 8px;
    padding: 8px 16px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    cursor: pointer;
    z-index: 10;
    transition: background 0.15s ease-out;
  }

  #back-btn:hover { background: #262626; }

  #submissions-title {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #b3b3b3;
    margin: 0 0 24px;
    font-weight: 400;
  }

  #submissions-list {
    width: 500px;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .submission {
    position: relative;
    overflow: hidden;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: #111111;
    border: 1px solid #222222;
    border-radius: 8px;
    padding: 12px 14px;
    user-select: text;
    -webkit-user-select: text;
  }

  .submission-body {
    position: relative;
    z-index: 1;
    flex: 1;
    min-width: 0;
  }

  @property --h {
    syntax: '<percentage>';
    inherits: false;
    initial-value: 5%;
  }

  .glow {
    --h: 5%;
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease, --h 0.8s ease;
  }

  /* eased fade (many stops) so there is no visible hard edge */
  .glow.green { background: linear-gradient(to top, rgba(22, 163, 74, 1) 0%, rgba(22, 163, 74, 0.738) calc(var(--h) * 0.19), rgba(22, 163, 74, 0.541) calc(var(--h) * 0.34), rgba(22, 163, 74, 0.382) calc(var(--h) * 0.47), rgba(22, 163, 74, 0.278) calc(var(--h) * 0.565), rgba(22, 163, 74, 0.194) calc(var(--h) * 0.65), rgba(22, 163, 74, 0.126) calc(var(--h) * 0.73), rgba(22, 163, 74, 0.075) calc(var(--h) * 0.802), rgba(22, 163, 74, 0.042) calc(var(--h) * 0.861), rgba(22, 163, 74, 0.021) calc(var(--h) * 0.91), rgba(22, 163, 74, 0.008) calc(var(--h) * 0.952), rgba(22, 163, 74, 0.003) calc(var(--h) * 0.982), rgba(22, 163, 74, 0) var(--h)); }
  .glow.red   { background: linear-gradient(to top, rgba(220, 38, 38, 1) 0%, rgba(220, 38, 38, 0.738) calc(var(--h) * 0.19), rgba(220, 38, 38, 0.541) calc(var(--h) * 0.34), rgba(220, 38, 38, 0.382) calc(var(--h) * 0.47), rgba(220, 38, 38, 0.278) calc(var(--h) * 0.565), rgba(220, 38, 38, 0.194) calc(var(--h) * 0.65), rgba(220, 38, 38, 0.126) calc(var(--h) * 0.73), rgba(220, 38, 38, 0.075) calc(var(--h) * 0.802), rgba(220, 38, 38, 0.042) calc(var(--h) * 0.861), rgba(220, 38, 38, 0.021) calc(var(--h) * 0.91), rgba(220, 38, 38, 0.008) calc(var(--h) * 0.952), rgba(220, 38, 38, 0.003) calc(var(--h) * 0.982), rgba(220, 38, 38, 0) var(--h)); }

  .vote-col {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    user-select: none;
    -webkit-user-select: none;
  }

  .vote-btn {
    background: none;
    border: none;
    color: #555555;
    font-size: 14px;
    line-height: 1;
    padding: 4px 6px;
    cursor: pointer;
    transition: color 0.15s ease-out, transform 0.1s ease-out;
  }

  .vote-btn:hover { color: #aaaaaa; transform: scale(1.15); }
  .vote-btn.active { color: #ffffff; }

  .vote-score {
    font-size: 14px;
    font-weight: 700;
    min-width: 24px;
    text-align: center;
  }

  #sort-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .sort-btn {
    background: none;
    color: #777777;
    border: 1px solid #333333;
    border-radius: 14px;
    padding: 3px 14px;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.15s ease-out, border-color 0.15s ease-out;
  }

  .sort-btn:hover { color: #ffffff; }
  .sort-btn.active { color: #ffffff; border-color: #777777; }

  .submission-text {
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  .submission-time {
    margin-top: 6px;
    font-size: 11px;
    color: #777777;
  }

  #submissions-empty {
    color: #777777;
    font-size: 14px;
  }
</style>
</head>
<body>

<!-- ====== MAIN PAGE ====== -->
<div id="main-view">
  <a href="https://soundcloud.com/toast_03" target="_blank" rel="noopener noreferrer" id="soundcloud-link">
    <img src="soundcloudicon.png" alt="SoundCloud" id="soundcloud-img">
  </a>

  <p id="who-is-toast">who is toast</p>

  <div id="submit-box">
    <div id="blocked-msg"></div>
    <div id="submit-label">2K FOLLOWERS SUBMISSIONS EVENT</div>
    <textarea id="submit-text" maxlength="280" placeholder="TYPE IN YOUR SUBMISSION FOR THE 2K FOLLOWERS"></textarea>
    <div id="submit-row">
      <span id="char-count">0 / 280</span>
      <button id="submit-btn" type="button">Submit</button>
    </div>
    <div id="submit-status"></div>
    <div id="submit-hint">mind you, you can type in ANY idea you want, such as "Make a Sample pack", "Release an album!", "Create a drumkit!" etc.</div>
  </div>
</div>

<!-- ====== SUBMISSIONS PAGE ====== -->
<div id="submissions-view" hidden>
  <button id="back-btn" type="button">&larr; back</button>
  <h2 id="submissions-title">Submissions</h2>
  <div id="sort-bar">
    <button type="button" class="sort-btn active" data-sort="top">top</button>
    <button type="button" class="sort-btn" data-sort="new">new</button>
  </div>
  <div id="submissions-list"></div>
</div>

<!-- ====== UNDO POPUP ====== -->
<button id="undo-popup" type="button" hidden>
  <span id="undo-text">wanna change something? click on me!</span>
  <span id="undo-count">posting in 10s</span>
  <span id="undo-bar"></span>
</button>

<!-- ====== HOVER TAB ====== -->
<div id="tab-zone">
  <button id="submissions-tab" type="button">submissions</button>
</div>

<script>
  /* ================= SETTINGS ================= */
  // To make submissions shared between ALL visitors, paste your Firebase
  // Realtime Database URL here, e.g. 'https://your-project-default-rtdb.firebaseio.com'
  // Leave it empty to store submissions only in the visitor's own browser.
  const DB_URL = 'https://submissions-3e3fc-default-rtdb.europe-west1.firebasedatabase.app';

  const MAX_LENGTH = 280;
  const COOLDOWN_MS = 30 * 60 * 1000;   // 30 minutes between submissions
  const UNDO_MS = 10000;                // time to change your mind after hitting submit
  /* ============================================ */

  /* ---------- Existing logo + "who is toast" behavior ---------- */
  const link = document.getElementById('soundcloud-link');
  const img = document.getElementById('soundcloud-img');

  link.addEventListener('click', function (e) {
    e.preventDefault();

    img.classList.remove('reset');
    img.classList.add('clicked');

    setTimeout(() => {
      img.classList.remove('clicked');
      img.classList.add('reset');
    }, 100);

    setTimeout(() => {
      window.open(link.href, '_blank', 'noopener,noreferrer');
    }, 500);
  });

  const toastText = document.getElementById('who-is-toast');
  toastText.addEventListener('click', function () {
    window.open('https://linktr.ee/toastW', '_blank', 'noopener,noreferrer');
  });

  /* ---------- Storage layer ---------- */
  const LOCAL_KEY = 'toast_submissions';
  const LOCAL_VOTES_KEY = 'toast_votes';
  const dbBase = DB_URL.replace(/\/$/, '');

  function getVoterId() {
    try {
      let id = localStorage.getItem('toast_voter');
      if (!id) {
        id = 'v' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('toast_voter', id);
      }
      return id;
    } catch (e) {
      return 'v' + Math.random().toString(36).slice(2);
    }
  }
  const voterId = getVoterId();

  function readLocal(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; }
  }

  /* ---------- Blocked-word filter ---------- */
  // STEMS are blocked even inside longer words (fucking, bullshit, ...).
  const BAD_STEMS = ('/shit bitch whore slut faggot nigger nigga niggah niggaz pussy dildo jizz ' +
    'cocksuck cumshot blowjob handjob dickhead dumbass asshole arsehole asshat asswipe assclown ' +
    'jackass douchebag bastard scheiss kurw pierdol spierdal wypierdal jebac jebany jebal jebie ' +
    'jebn skurwy chuj pizd blyat blyad').split(' ');

  // WORDS are blocked only as whole words, so innocent words like "class",
  // "cocktail", "Dickens" or "assassin" are NOT caught. Add or remove words here.
  const BAD_WORDS = new Set(('ass asses arse arses fatass smartass bollocks bollock bugger buggered ' +
    'butthole buttholes boner cock cocks cunt cunts cunty crap craps crappy crapper damn damned ' +
    'dammit damnit goddamn goddamned goddammit goddamnit hells dick dicks douche douches ' +
    'fag fags fagot fagots dyke dykes lesbo lesbos tranny trannies shemale shemales retard retards ' +
    'retarded tard tards spastic spaz spazz mong mongoloid spic spick spics chink chinks gook gooks ' +
    'kike kikes wetback wetbacks beaner beaners coon coons darkie darky paki pakis raghead ragheads ' +
    'towelhead towelheads zipperhead chinaman jap japs honky honkey honkies squaw injun halfbreed ' +
    'cum cums cumming jerkoff jackoff wank wanks wanker wankers wanking tosser tossers tits titty ' +
    'titties anus anal porn porno pornhub orgasm orgasms masturbate masturbating masturbation fap ' +
    'fapping horny horney skank skanks skanky thot thots hoe hoes hooker hookers milf rape raped ' +
    'rapes raping rapist rapists pedo pedos pedophile pedophiles paedo paedophile prick pricks piss ' +
    'pisses pissed pissing pisser twat twats wtf stfu gtfo fml kys kms fuk fuks fuking fuq fck fcuk ' +
    'fvck phuck shyt sht btch biatch bytch dck cnt ahole ngga ngger ' +
    'puta putas puto putos putain merde merdes connard connards connasse salope salopes enculer ' +
    'encule enculee nique niquer ntm mierda mierdas cabron cabrones pendejo pendejos pendeja joder ' +
    'jodete chinga chingar chingada chingado culero verga vergas maricon maricones scheisse ' +
    'arschloch wichser fotze fotzen hurensohn schlampe vaffanculo stronzo stronzi cazzo cazzi merda ' +
    'puttana troia minchia cyka suka sukin pidor pidoras pidar mudak ebat ebal huy khuy zalupa govno ' +
    'gandon huj huja huje cipa cipy cipka cipke dupa dupek dziwka dziwki dziwko suki suko pizda ' +
    'zjeb zjeby debil debile cwel cwele ciota ciote kutas kutasy kutasa gowno gowna szmata szmaty ' +
    'szmato pojeb pojeby').split(' '));

  // Innocent words that happen to contain a blocked stem.
  const ALLOWED_WORDS = new Set('shiitake shiitakes shitake shitakes snigger sniggers sniggered sniggering'.split(' '));

  const LEET = { '0': 'o', '1': 'i', '3': 'e', '4': 'a', '5': 's', '7': 't', '@': 'a', '$': 's', '!': 'i', '+': 't' };

  function dedupe(w) { return w.replace(/(.)\1+/g, '$1'); }
  const BAD_STEMS_DEDUPED = BAD_STEMS.map(dedupe);

  // lowercase, strip accents (so "ś" -> "s"), fix a few letters accents can't
  function foldText(t) {
    return t.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
      .replace(/\u0142/g, 'l').replace(/\u00df/g, 'ss').replace(/\u00f8/g, 'o').replace(/\u0111/g, 'd');
  }

  function wordIsBad(w) {
    if (!w || ALLOWED_WORDS.has(w)) return false;
    const w2 = w.replace(/(.)\1{2,}/g, '$1$1');   // "assss" -> "ass"
    if (BAD_WORDS.has(w) || BAD_WORDS.has(w2)) return true;
    const w3 = dedupe(w);                           // "fuuuuck" -> "fuck"
    for (let i = 0; i < BAD_STEMS.length; i++) {
      const stem = BAD_STEMS[i];
      if (w.indexOf(stem) !== -1) return true;
      if (BAD_STEMS_DEDUPED[i] === stem) {
        if (w3.indexOf(stem) !== -1) return true;   // stems without double letters: catch any stretching
      } else if (w2.indexOf(stem) !== -1) {
        return true;                                 // stems with double letters: only collapse long runs
      }
    }
    return false;
  }

  function hasProfanity(text) {
    const chunks = foldText(text).split(/\s+/).filter(Boolean);
    let spaced = '';   // catches "f u c k" (single letters separated by spaces)
    for (let i = 0; i <= chunks.length; i++) {
      const chunk = chunks[i];
      const plain = chunk ? chunk.replace(/[^a-z]/g, '') : '';
      if (plain.length === 1) { spaced += plain; continue; }
      if (spaced.length >= 3 && wordIsBad(spaced)) return true;
      spaced = '';
      if (!chunk) continue;
      if (wordIsBad(plain)) return true;
      // number/symbol swaps: sh1t, b!tch, @ss, $hit ...
      const leet = chunk.replace(/[013457@$!+]/g, function (c) { return LEET[c]; }).replace(/[^a-z]/g, '');
      if (leet !== plain && wordIsBad(leet)) return true;
    }
    return false;
  }

  function hasSkibidi(t) {
    return t.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '').indexOf('skibidi') !== -1;
  }

  function isBlocked(t) {
    return hasSkibidi(t) || hasProfanity(t);
  }

  function normalizeText(t) {
    const cleaned = t.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
    return cleaned || t.toLowerCase().replace(/\s+/g, ' ').trim();
  }

  function hashText(str) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) {
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 'd' + (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }

  async function saveSubmission(text) {
    const norm = normalizeText(text);
    const entry = { text: text, time: Date.now() };
    if (DB_URL) {
      const check = await fetch(dbBase + '/submissions.json');
      if (check.ok) {
        const data = await check.json();
        const exists = data && Object.keys(data).some(function (k) {
          return data[k] && typeof data[k].text === 'string' && normalizeText(data[k].text) === norm;
        });
        if (exists) throw new Error('duplicate');
      }
      // The key is a hash of the text, so the database itself refuses a second copy.
      const res = await fetch(dbBase + '/submissions/' + hashText(norm) + '.json', {
        method: 'PUT',
        body: JSON.stringify(entry)
      });
      if (res.status === 401 || res.status === 403) throw new Error('duplicate');
      if (!res.ok) throw new Error('Save failed');
      return;
    }
    const list = readLocal(LOCAL_KEY, []);
    if (list.some(function (s) { return s && typeof s.text === 'string' && normalizeText(s.text) === norm; })) {
      throw new Error('duplicate');
    }
    entry.id = 'local' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    list.push(entry);
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); } catch (e) { throw new Error('Save failed'); }
  }

  async function loadSubmissions() {
    let subs = [];
    let votes = {};
    if (DB_URL) {
      const results = await Promise.all([
        fetch(dbBase + '/submissions.json'),
        fetch(dbBase + '/votes.json')
      ]);
      if (!results[0].ok) throw new Error('Load failed');
      const data = await results[0].json();
      subs = data ? Object.keys(data).map(function (id) {
        return Object.assign({ id: id }, data[id]);
      }) : [];
      votes = results[1].ok ? ((await results[1].json()) || {}) : {};
    } else {
      subs = readLocal(LOCAL_KEY, []).map(function (s, i) {
        return Object.assign({ id: 'local-' + i }, s);
      });
      votes = readLocal(LOCAL_VOTES_KEY, {});
    }
    const seen = {};
    return subs
      .filter(function (s) { return s && typeof s.text === 'string' && !isBlocked(s.text); })
      .sort(function (x, y) { return (x.time || 0) - (y.time || 0); })
      .filter(function (s) {
        const n = normalizeText(s.text);
        if (seen[n]) return false;
        seen[n] = true;
        return true;
      })
      .map(function (s) {
        const v = votes[s.id] || {};
        s.votes = Object.assign({}, v);
        s.score = calculateScore(s.votes);
        s.myVote = s.votes[voterId] === 1 ? 1 : (s.votes[voterId] === -1 ? -1 : 0);
        return s;
      });
  }

  // Always derive the displayed score from the vote records themselves.
  // This prevents the UI score drifting out of sync after repeated vote changes.
  function calculateScore(votes) {
    return Object.keys(votes || {}).reduce(function (total, key) {
      return total + (votes[key] === 1 ? 1 : (votes[key] === -1 ? -1 : 0));
    }, 0);
  }

  // value: 1 (up), -1 (down), or 0 (remove my vote)
  async function saveVote(id, value) {
    if (DB_URL) {
      const url = dbBase + '/votes/' + encodeURIComponent(id) + '/' + encodeURIComponent(voterId) + '.json';
      const res = value === 0
        ? await fetch(url, { method: 'DELETE' })
        : await fetch(url, { method: 'PUT', body: JSON.stringify(value) });
      if (!res.ok) throw new Error('Vote failed');
      return;
    }
    const votes = readLocal(LOCAL_VOTES_KEY, {});
    votes[id] = votes[id] || {};
    if (value === 0) delete votes[id][voterId];
    else votes[id][voterId] = value;
    try { localStorage.setItem(LOCAL_VOTES_KEY, JSON.stringify(votes)); } catch (e) { throw new Error('Vote failed'); }
  }

  /* ---------- Submit box ---------- */
  const textarea = document.getElementById('submit-text');
  const submitBtn = document.getElementById('submit-btn');
  const statusEl = document.getElementById('submit-status');
  const charCount = document.getElementById('char-count');
  let lastSubmit = 0;
  const blockedMsg = document.getElementById('blocked-msg');

  textarea.addEventListener('input', function () {
    charCount.textContent = textarea.value.length + ' / ' + MAX_LENGTH;
    blockedMsg.textContent = '';
  });

  const COOLDOWN_KEY = 'toast_last_submit';
  const undoPopup = document.getElementById('undo-popup');
  const undoCount = document.getElementById('undo-count');
  const undoBar = document.getElementById('undo-bar');
  let pendingSend = null;

  // The cooldown is remembered in the browser, so refreshing the page doesn't reset it.
  function getLastSubmit() {
    let stored = 0;
    try { stored = parseInt(localStorage.getItem(COOLDOWN_KEY), 10) || 0; } catch (e) {}
    return Math.max(lastSubmit, stored);
  }

  function formatWait(ms) {
    if (ms >= 60000) return Math.ceil(ms / 60000) + ' min';
    return Math.ceil(ms / 1000) + 's';
  }

  function hideUndo() {
    undoPopup.hidden = true;
    undoBar.classList.remove('run');
  }

  // Actually posts the submission (runs when the 10 second countdown ends).
  async function completeSend(text) {
    hideUndo();
    statusEl.textContent = 'sending...';
    try {
      await saveSubmission(text);
      lastSubmit = Date.now();
      try { localStorage.setItem(COOLDOWN_KEY, String(lastSubmit)); } catch (e) {}
      textarea.value = '';
      charCount.textContent = '0 / ' + MAX_LENGTH;
      statusEl.textContent = 'sent!';
    } catch (e) {
      statusEl.textContent = e.message === 'duplicate'
        ? 'someone already submitted that!'
        : 'something went wrong, try again';
    }
    pendingSend = null;
    textarea.disabled = false;
    submitBtn.disabled = false;
  }

  function startSend(text) {
    const deadline = Date.now() + UNDO_MS;
    textarea.disabled = true;
    submitBtn.disabled = true;
    statusEl.textContent = '';

    undoPopup.hidden = false;
    undoBar.style.transitionDuration = UNDO_MS + 'ms';
    undoBar.classList.remove('run');
    void undoBar.offsetWidth;   // restart the shrinking bar
    undoBar.classList.add('run');

    pendingSend = { timer: null };
    function tick() {
      const left = deadline - Date.now();
      if (left <= 0) {
        clearInterval(pendingSend.timer);
        completeSend(text);
        return;
      }
      undoCount.textContent = 'posting in ' + Math.ceil(left / 1000) + 's';
    }
    tick();
    pendingSend.timer = setInterval(tick, 200);
  }

  // Clicking the popup cancels the post and lets them edit their text.
  undoPopup.addEventListener('click', function () {
    if (!pendingSend) return;
    clearInterval(pendingSend.timer);
    pendingSend = null;
    hideUndo();
    textarea.disabled = false;
    submitBtn.disabled = false;
    statusEl.textContent = 'not posted, edit it and submit again';
    textarea.focus();
  });

  submitBtn.addEventListener('click', function () {
    if (pendingSend) return;
    const text = textarea.value.trim();
    if (!text) {
      statusEl.textContent = 'write something first!';
      return;
    }
    if (isBlocked(text)) {
      blockedMsg.textContent = 'fuck you sincerely';
      statusEl.textContent = '';
      return;
    }
    const wait = COOLDOWN_MS - (Date.now() - getLastSubmit());
    if (wait > 0) {
      statusEl.textContent = 'slow down, you can submit again in ' + formatWait(wait);
      return;
    }
    startSend(text.slice(0, MAX_LENGTH));
  });

  /* ---------- View switching ---------- */
  const mainView = document.getElementById('main-view');
  const subView = document.getElementById('submissions-view');
  const subList = document.getElementById('submissions-list');
  const tabZone = document.getElementById('tab-zone');

  let currentList = [];
  let sortMode = 'top';

  function paintVote(s) {
    s._els.score.textContent = s.score;
    s._els.up.classList.toggle('active', s.myVote === 1);
    s._els.down.classList.toggle('active', s.myVote === -1);
  }

  // Green for upvoted, red for downvoted. The colored part of the card grows
  // from MIN_GLOW % of its height (barely any votes) up to MAX_GLOW % (the
  // most upvoted / most downvoted submission). Change these two numbers to tweak.
  const MIN_GLOW = 5;
  const MAX_GLOW = 30;

  function paintGlow() {
    let max = 0;
    let min = 0;
    currentList.forEach(function (s) {
      if (s.score > max) max = s.score;
      if (s.score < min) min = s.score;
    });
    currentList.forEach(function (s) {
      const g = s._els && s._els.glow;
      if (!g) return;
      if (s.score === 0) {
        g.style.opacity = 0;
        return;
      }
      const up = s.score > 0;
      const ratio = up ? s.score / max : s.score / min;
      g.classList.toggle('green', up);
      g.classList.toggle('red', !up);
      g.style.setProperty('--h', (MIN_GLOW + (MAX_GLOW - MIN_GLOW) * ratio).toFixed(2) + '%');
      g.style.opacity = 1;
    });
  }

  async function castVote(s, value) {
    if (s.pending) return;

    const previousVotes = Object.assign({}, s.votes || {});
    const previousVote = previousVotes[voterId] === 1 ? 1 :
      (previousVotes[voterId] === -1 ? -1 : 0);

    // Current site behavior: clicking either arrow while already voted removes
    // that vote; with no existing vote, add exactly one upvote or downvote.
    const nextVote = previousVote !== 0 ? 0 : value;

    s.votes = Object.assign({}, previousVotes);
    if (nextVote === 0) delete s.votes[voterId];
    else s.votes[voterId] = nextVote;

    s.myVote = nextVote;
    s.score = calculateScore(s.votes);
    s.pending = true;
    paintVote(s);
    paintGlow();

    try {
      await saveVote(s.id, nextVote);
    } catch (e) {
      s.votes = previousVotes;
      s.myVote = previousVote;
      s.score = calculateScore(previousVotes);
      paintVote(s);
      paintGlow();
    }

    s.pending = false;
  }

  function renderList() {
    subList.textContent = '';
    if (currentList.length === 0) {
      const empty = document.createElement('div');
      empty.id = 'submissions-empty';
      empty.textContent = 'nothing here yet';
      subList.appendChild(empty);
      return;
    }

    currentList.sort(function (a, b) {
      if (sortMode === 'top' && b.score !== a.score) return b.score - a.score;
      return (b.time || 0) - (a.time || 0);
    });

    currentList.forEach(function (s) {
      const card = document.createElement('div');
      card.className = 'submission';

      const glow = document.createElement('div');
      glow.className = 'glow';
      card.appendChild(glow);

      const col = document.createElement('div');
      col.className = 'vote-col';
      const up = document.createElement('button');
      up.type = 'button';
      up.className = 'vote-btn';
      up.textContent = '\u25B2';
      up.setAttribute('aria-label', 'upvote');
      const score = document.createElement('div');
      score.className = 'vote-score';
      const down = document.createElement('button');
      down.type = 'button';
      down.className = 'vote-btn';
      down.textContent = '\u25BC';
      down.setAttribute('aria-label', 'downvote');
      col.appendChild(up);
      col.appendChild(score);
      col.appendChild(down);

      const body = document.createElement('div');
      body.className = 'submission-body';

      const t = document.createElement('div');
      t.className = 'submission-text';
      t.textContent = s.text;

      const when = document.createElement('div');
      when.className = 'submission-time';
      when.textContent = s.time ? new Date(s.time).toLocaleString() : '';

      body.appendChild(t);
      body.appendChild(when);
      card.appendChild(col);
      card.appendChild(body);
      subList.appendChild(card);

      s._els = { up: up, down: down, score: score, glow: glow };
      paintVote(s);
      up.addEventListener('click', function () { castVote(s, 1); });
      down.addEventListener('click', function () { castVote(s, -1); });
    });
    paintGlow();
  }

  document.querySelectorAll('.sort-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      sortMode = btn.dataset.sort;
      document.querySelectorAll('.sort-btn').forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });
      renderList();
    });
  });

  async function showSubmissions() {
    mainView.hidden = true;
    tabZone.hidden = true;
    subView.hidden = false;
    window.scrollTo(0, 0);

    subList.textContent = '';
    const loading = document.createElement('div');
    loading.id = 'submissions-empty';
    loading.textContent = 'loading...';
    subList.appendChild(loading);

    try {
      currentList = await loadSubmissions();
    } catch (e) {
      loading.textContent = "couldn't load submissions";
      return;
    }
    renderList();
  }

  function showMain() {
    subView.hidden = true;
    mainView.hidden = false;
    tabZone.hidden = false;
    window.scrollTo(0, 0);
  }

  document.getElementById('submissions-tab').addEventListener('click', showSubmissions);
  document.getElementById('back-btn').addEventListener('click', showMain);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !subView.hidden) showMain();
  });
</script>

</body>
</html>
