<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>toast</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    background-color: #000000;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    position: relative;
  }

  #gradient-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-100%);
    background-color: #000000;
    background-image:
      radial-gradient(circle, rgba(0,0,0,0.4) 1.5px, transparent 1.5px),
      linear-gradient(to bottom, #b84dd6, #000000);
    background-size: 10px 10px, 100% 100%;
  }

  #gradient-overlay.reveal {
    animation: gradientReveal 0.35s ease;
  }

  @keyframes gradientReveal {
    0% { opacity: 0; transform: translateY(-100%); }
    50% { opacity: 1; transform: translateY(-25%); }
    100% { opacity: 0; transform: translateY(0); }
  }

  body > *:not(#gradient-overlay) {
    position: relative;
    z-index: 1;
  }

  #soundcloud-link img {
    width: 100px;
    transition: transform 0.1s ease-out;
  }

  #soundcloud-link img.clicked {
    transform: scale(1.1);
    transition: transform 0.1s ease-out;
  }

  #soundcloud-link img.reset {
    transform: scale(1);
    transition: transform 0.4s ease-out;
  }

  #who-is-toast {
    color: #ffffff;
    margin-top: 16px;
    font-size: 18px;
    font-weight: 400;
    cursor: pointer;
    transition: font-weight 0.15s ease-out;
  }

  #who-is-toast:hover {
    font-weight: 700;
  }

  #newest-release {
    margin-top: 40px;
    text-align: center;
    color: #ffffff;
  }

  #newest-release-label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #b3b3b3;
    margin-bottom: 10px;
  }

  #newest-release a {
    text-decoration: none;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #newest-release img {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
    transition: transform 0.2s ease-out;
  }

  #newest-release a:hover img {
    transform: scale(1.05);
  }

  #newest-release-title {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 400;
    transition: font-weight 0.15s ease-out;
  }

  #newest-release a:hover #newest-release-title {
    font-weight: 700;
  }

  .click-ripple {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #b84dd6;
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.8;
    pointer-events: none;
    z-index: 2;
    animation: rippleExpand 0.6s ease-out forwards;
  }

  @keyframes rippleExpand {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(12); opacity: 0; }
  }
</style>
</head>
<body>

<div id="gradient-overlay"></div>

<a href="https://soundcloud.com/toast_03" target="_blank" rel="noopener noreferrer" id="soundcloud-link">
  <img src="soundcloudicon.png" alt="SoundCloud" id="soundcloud-img">
</a>

<p id="who-is-toast">who is toast</p>

<!-- ====== EDIT THIS BLOCK EACH TIME YOU DROP A NEW SONG ====== -->
<div id="newest-release">
  <div id="newest-release-label">Newest Release</div>
  <a href="https://open.spotify.com/track/REPLACE_WITH_TRACK_ID" target="_blank" rel="noopener noreferrer">
    <img src="juniorhigh.png" alt="Newest release cover art">
    <div id="newest-release-title">Junior High</div>
  </a>
</div>
<!-- ============================================================ -->

<script>
  const link = document.getElementById('soundcloud-link');
  const img = document.getElementById('soundcloud-img');

  link.addEventListener('click', function (e) {
    e.preventDefault();

    img.classList.remove('reset');
    img.classList.add('clicked');

    setTimeout(() => {
      img.classList.remove('clicked');
      img.classList.add('reset');
    }, 100);

    setTimeout(() => {
      window.open(link.href, '_blank', 'noopener,noreferrer');
    }, 500);
  });

  const toastText = document.getElementById('who-is-toast');
  toastText.addEventListener('click', function () {
    window.open('https://linktr.ee/toastW', '_blank', 'noopener,noreferrer');
  });

  const gradientOverlay = document.getElementById('gradient-overlay');
  document.addEventListener('click', function (e) {
    gradientOverlay.classList.remove('reveal');
    void gradientOverlay.offsetWidth;
    gradientOverlay.classList.add('reveal');

    const ripple = document.createElement('div');
    ripple.className = 'click-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    ripple.addEventListener('animationend', function () {
      ripple.remove();
    });
  });

  gradientOverlay.addEventListener('animationend', function () {
    gradientOverlay.classList.remove('reveal');
  });
</script>

</body>
</html>
