<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>toast</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    background-color: #000000;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    transition: background-color 2s ease;
  }

  body > *:not(.click-ripple):not(.click-splash) {
    position: relative;
    z-index: 1;
  }

  #soundcloud-link img {
    width: 100px;
    transition: transform 0.1s ease-out;
  }

  #soundcloud-link img.clicked {
    transform: scale(1.1);
    transition: transform 0.1s ease-out;
  }

  #soundcloud-link img.reset {
    transform: scale(1);
    transition: transform 0.4s ease-out;
  }

  #soundcloud-link img:hover {
    transform: scale(1.05);
  }

  #who-is-toast {
    color: #ffffff;
    margin-top: 16px;
    font-size: 18px;
    font-weight: 400;
    cursor: pointer;
    transition: font-weight 0.15s ease-out;
  }

  #who-is-toast:hover {
    font-weight: 700;
  }

  #newest-release {
    margin-top: 40px;
    text-align: center;
    color: #ffffff;
  }

  #newest-release-label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #b3b3b3;
    margin-bottom: 10px;
  }

  #newest-release a {
    text-decoration: none;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #newest-release img {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
    transition: transform 0.2s ease-out;
  }

  #newest-release a:hover img {
    transform: scale(1.05);
  }

  #newest-release-title {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 400;
    transition: font-weight 0.15s ease-out;
  }

  #newest-release a:hover #newest-release-title {
    font-weight: 700;
  }

  .click-splash {
    position: fixed;
    transform: translate(-50%, -50%) scale(0) rotate(var(--splash-rotation, 0deg));
    pointer-events: none;
    z-index: 0;
    animation: splashGrow 0.3s ease-out forwards;
  }

  @keyframes splashGrow {
    0% { transform: translate(-50%, -50%) scale(0) rotate(var(--splash-rotation, 0deg)); }
    100% { transform: translate(-50%, -50%) scale(1) rotate(var(--splash-rotation, 0deg)); }
  }

  #too-many-splashes {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ffffff;
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    z-index: 3;
    transition: opacity 2s ease;
  }

  #too-many-splashes.visible {
    opacity: 1;
  }
</style>
</head>
<body>

<a href="https://soundcloud.com/toast_03" target="_blank" rel="noopener noreferrer" id="soundcloud-link">
  <img src="soundcloudicon.png" alt="SoundCloud" id="soundcloud-img">
</a>

<p id="who-is-toast">who is toast</p>

<!-- ====== EDIT THIS BLOCK EACH TIME YOU DROP A NEW SONG ====== -->
<div id="newest-release">
  <div id="newest-release-label">Newest Release</div>
  <a href="https://open.spotify.com/track/REPLACE_WITH_TRACK_ID" target="_blank" rel="noopener noreferrer">
    <img src="juniorhigh.png" alt="Newest release cover art">
    <div id="newest-release-title">Junior High</div>
  </a>
</div>
<!-- ============================================================ -->

<p id="too-many-splashes">too many splashes bub &gt;:c</p>

<script>
  const link = document.getElementById('soundcloud-link');
  const img = document.getElementById('soundcloud-img');

  link.addEventListener('click', function (e) {
    e.preventDefault();

    img.classList.remove('reset');
    img.classList.add('clicked');

    setTimeout(() => {
      img.classList.remove('clicked');
      img.classList.add('reset');
    }, 100);

    setTimeout(() => {
      window.open(link.href, '_blank', 'noopener,noreferrer');
    }, 500);
  });

  const toastText = document.getElementById('who-is-toast');
  toastText.addEventListener('click', function () {
    window.open('https://linktr.ee/toastW', '_blank', 'noopener,noreferrer');
  });

  const splashImages = ['splash1.png', 'splash2.png', 'splash3.png', 'splash4.png', 'splash5.png', 'splash6.png'];

  let splashCount = 0;
  let limitReached = false;

  function placeSplash(x, y) {
    if (limitReached) return;

    const splash = document.createElement('img');
    splash.src = splashImages[Math.floor(Math.random() * splashImages.length)];
    splash.className = 'click-splash';
    const size = Math.floor(Math.random() * (300 - 48 + 1)) + 48;
    splash.style.width = size + 'px';
    splash.style.height = size + 'px';
    splash.style.left = x + 'px';
    splash.style.top = y + 'px';
    if (Math.random() < 0.5) {
      const rotation = Math.floor(Math.random() * 361);
      splash.style.setProperty('--splash-rotation', rotation + 'deg');
    }
    document.body.appendChild(splash);

    splashCount++;
    if (splashCount >= 200) {
      limitReached = true;
      document.body.style.backgroundColor = '#b84ed6';
      document.getElementById('too-many-splashes').classList.add('visible');
      document.querySelectorAll('.click-splash').forEach(function (el) {
        el.remove();
      });
    }
  }

  let isDragging = false;
  let hasMoved = false;
  let lastX = 0;
  let lastY = 0;
  const dotSpacing = 70;

  document.addEventListener('mousedown', function (e) {
    e.preventDefault();
    isDragging = true;
    hasMoved = false;
    lastX = e.clientX;
    lastY = e.clientY;
  });

  document.addEventListener('mousemove', function (e) {
    if (!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    if (Math.sqrt(dx * dx + dy * dy) >= dotSpacing) {
      hasMoved = true;
      placeSplash(e.clientX, e.clientY);
      lastX = e.clientX;
      lastY = e.clientY;
    }
  });

  document.addEventListener('mouseup', function (e) {
    if (isDragging && !hasMoved) {
      placeSplash(e.clientX, e.clientY);
    }
    isDragging = false;
  });
</script>

</body>
</html>
