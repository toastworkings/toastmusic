<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toast</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    background-color: #000000;
    margin: 0;
    font-family: 'Poppins', sans-serif;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    color: #ffffff;
  }

  [hidden] { display: none !important; }

  /* ---------- MAIN VIEW ---------- */
  #main-view {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  #soundcloud-link img {
    width: 100px;
    transition: transform 0.1s ease-out;
  }

  #soundcloud-link img.clicked {
    transform: scale(1.1);
    transition: transform 0.1s ease-out;
  }

  #soundcloud-link img.reset {
    transform: scale(1);
    transition: transform 0.4s ease-out;
  }

  #soundcloud-link img:hover {
    transform: scale(1.05);
  }

  #who-is-toast {
    color: #ffffff;
    margin-top: 16px;
    font-size: 18px;
    font-weight: 400;
    cursor: pointer;
    transition: font-weight 0.15s ease-out;
  }

  #who-is-toast:hover {
    font-weight: 700;
  }

  #newest-release {
    margin-top: 40px;
    text-align: center;
    color: #ffffff;
  }

  #newest-release-label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #b3b3b3;
    margin-bottom: 10px;
  }

  #newest-release a {
    text-decoration: none;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #newest-release img {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
    transition: transform 0.2s ease-out;
  }

  #newest-release a:hover img {
    transform: scale(1.05);
  }

  #newest-release-title {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 400;
    transition: font-weight 0.15s ease-out;
  }

  #newest-release a:hover #newest-release-title {
    font-weight: 700;
  }

  /* ---------- SUBMIT BOX ---------- */
  #submit-box {
    margin-top: 40px;
    width: 300px;
    max-width: 85vw;
    text-align: center;
  }

  #submit-label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #b3b3b3;
    margin-bottom: 10px;
  }

  #submit-text {
    box-sizing: border-box;
    width: 100%;
    height: 80px;
    resize: none;
    background: #111111;
    color: #ffffff;
    border: 1px solid #333333;
    border-radius: 8px;
    padding: 10px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
    transition: border-color 0.15s ease-out;
  }

  #submit-text:focus {
    border-color: #777777;
  }

  #submit-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }

  #char-count {
    font-size: 12px;
    color: #777777;
  }

  #submit-btn {
    background: #ffffff;
    color: #000000;
    border: none;
    border-radius: 6px;
    padding: 6px 16px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s ease-out, opacity 0.15s ease-out;
  }

  #submit-btn:hover { transform: scale(1.05); }
  #submit-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

  #submit-status {
    margin-top: 8px;
    min-height: 18px;
    font-size: 13px;
    color: #b3b3b3;
  }

  /* ---------- TOP TAB ---------- */
  #tab-zone {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 44px;
    z-index: 10;
  }

  #submissions-tab {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    transform: translateY(-30px);
    height: 36px;
    background: #1a1a1a;
    color: #ffffff;
    border: 1px solid #333333;
    border-top: none;
    border-radius: 0 0 10px 10px;
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.2s ease-out, background 0.15s ease-out;
    user-select: none;
    -webkit-user-select: none;
  }

  #tab-zone:hover #submissions-tab,
  #submissions-tab:focus-visible {
    transform: translateY(0);
    background: #262626;
  }

  /* ---------- SUBMISSIONS VIEW ---------- */
  #submissions-view {
    min-height: 100vh;
    padding: 70px 20px 40px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #back-btn {
    position: fixed;
    top: 16px;
    left: 16px;
    background: #1a1a1a;
    color: #ffffff;
    border: 1px solid #333333;
    border-radius: 8px;
    padding: 8px 16px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    cursor: pointer;
    z-index: 10;
    transition: background 0.15s ease-out;
  }

  #back-btn:hover { background: #262626; }

  #submissions-title {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #b3b3b3;
    margin: 0 0 24px;
    font-weight: 400;
  }

  #submissions-list {
    width: 500px;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .submission {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: #111111;
    border: 1px solid #222222;
    border-radius: 8px;
    padding: 12px 14px;
    user-select: text;
    -webkit-user-select: text;
  }

  .submission-body {
    flex: 1;
    min-width: 0;
  }

  .vote-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    user-select: none;
    -webkit-user-select: none;
  }

  .vote-btn {
    background: none;
    border: none;
    color: #555555;
    font-size: 14px;
    line-height: 1;
    padding: 4px 6px;
    cursor: pointer;
    transition: color 0.15s ease-out, transform 0.1s ease-out;
  }

  .vote-btn:hover { color: #aaaaaa; transform: scale(1.15); }
  .vote-btn.active { color: #ffffff; }

  .vote-score {
    font-size: 14px;
    font-weight: 700;
    min-width: 24px;
    text-align: center;
  }

  #sort-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .sort-btn {
    background: none;
    color: #777777;
    border: 1px solid #333333;
    border-radius: 14px;
    padding: 3px 14px;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.15s ease-out, border-color 0.15s ease-out;
  }

  .sort-btn:hover { color: #ffffff; }
  .sort-btn.active { color: #ffffff; border-color: #777777; }

  .submission-text {
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }

  .submission-time {
    margin-top: 6px;
    font-size: 11px;
    color: #777777;
  }

  #submissions-empty {
    color: #777777;
    font-size: 14px;
  }
</style>
</head>
<body>

<!-- ====== MAIN PAGE ====== -->
<div id="main-view">
  <a href="https://soundcloud.com/toast_03" target="_blank" rel="noopener noreferrer" id="soundcloud-link">
    <img src="soundcloudicon.png" alt="SoundCloud" id="soundcloud-img">
  </a>

  <p id="who-is-toast">who is toast</p>

  <div id="submit-box">
    <div id="submit-label">2K FOLLOWERS SUBMISSIONS</div>
    <textarea id="submit-text" maxlength="280" placeholder="type anything..."></textarea>
    <div id="submit-row">
      <span id="char-count">0 / 280</span>
      <button id="submit-btn" type="button">Submit</button>
    </div>
    <div id="submit-status"></div>
  </div>
</div>

<!-- ====== SUBMISSIONS PAGE ====== -->
<div id="submissions-view" hidden>
  <button id="back-btn" type="button">&larr; back</button>
  <h2 id="submissions-title">Submissions</h2>
  <div id="sort-bar">
    <button type="button" class="sort-btn active" data-sort="top">top</button>
    <button type="button" class="sort-btn" data-sort="new">new</button>
  </div>
  <div id="submissions-list"></div>
</div>

<!-- ====== HOVER TAB ====== -->
<div id="tab-zone">
  <button id="submissions-tab" type="button">submissions</button>
</div>

<script>
  /* ================= SETTINGS ================= */
  // To make submissions shared between ALL visitors, paste your Firebase
  // Realtime Database URL here, e.g. 'https://your-project-default-rtdb.firebaseio.com'
  // Leave it empty to store submissions only in the visitor's own browser.
  const DB_URL = 'https://submissions-3e3fc-default-rtdb.europe-west1.firebasedatabase.app';

  const MAX_LENGTH = 280;
  const COOLDOWN_MS = 10000;
  /* ============================================ */

  /* ---------- Existing logo + "who is toast" behavior ---------- */
  const link = document.getElementById('soundcloud-link');
  const img = document.getElementById('soundcloud-img');

  link.addEventListener('click', function (e) {
    e.preventDefault();

    img.classList.remove('reset');
    img.classList.add('clicked');

    setTimeout(() => {
      img.classList.remove('clicked');
      img.classList.add('reset');
    }, 100);

    setTimeout(() => {
      window.open(link.href, '_blank', 'noopener,noreferrer');
    }, 500);
  });

  const toastText = document.getElementById('who-is-toast');
  toastText.addEventListener('click', function () {
    window.open('https://linktr.ee/toastW', '_blank', 'noopener,noreferrer');
  });

  /* ---------- Storage layer ---------- */
  const LOCAL_KEY = 'toast_submissions';
  const LOCAL_VOTES_KEY = 'toast_votes';
  const dbBase = DB_URL.replace(/\/$/, '');

  function getVoterId() {
    try {
      let id = localStorage.getItem('toast_voter');
      if (!id) {
        id = 'v' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('toast_voter', id);
      }
      return id;
    } catch (e) {
      return 'v' + Math.random().toString(36).slice(2);
    }
  }
  const voterId = getVoterId();

  function readLocal(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (e) { return fallback; }
  }

  async function saveSubmission(text) {
    const entry = { text: text, time: Date.now() };
    if (DB_URL) {
      const res = await fetch(dbBase + '/submissions.json', {
        method: 'POST',
        body: JSON.stringify(entry)
      });
      if (!res.ok) throw new Error('Save failed');
      return;
    }
    entry.id = 'local' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const list = readLocal(LOCAL_KEY, []);
    list.push(entry);
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); } catch (e) { throw new Error('Save failed'); }
  }

  async function loadSubmissions() {
    let subs = [];
    let votes = {};
    if (DB_URL) {
      const results = await Promise.all([
        fetch(dbBase + '/submissions.json'),
        fetch(dbBase + '/votes.json')
      ]);
      if (!results[0].ok) throw new Error('Load failed');
      const data = await results[0].json();
      subs = data ? Object.keys(data).map(function (id) {
        return Object.assign({ id: id }, data[id]);
      }) : [];
      votes = results[1].ok ? ((await results[1].json()) || {}) : {};
    } else {
      subs = readLocal(LOCAL_KEY, []).map(function (s, i) {
        return Object.assign({ id: 'local-' + i }, s);
      });
      votes = readLocal(LOCAL_VOTES_KEY, {});
    }
    return subs
      .filter(function (s) { return s && typeof s.text === 'string'; })
      .map(function (s) {
        const v = votes[s.id] || {};
        let score = 0;
        Object.keys(v).forEach(function (k) {
          if (v[k] === 1) score += 1;
          else if (v[k] === -1) score -= 1;
        });
        s.score = score;
        s.myVote = v[voterId] === 1 ? 1 : (v[voterId] === -1 ? -1 : 0);
        return s;
      });
  }

  // value: 1 (up), -1 (down), or 0 (remove my vote)
  async function saveVote(id, value) {
    if (DB_URL) {
      const url = dbBase + '/votes/' + encodeURIComponent(id) + '/' + encodeURIComponent(voterId) + '.json';
      const res = value === 0
        ? await fetch(url, { method: 'DELETE' })
        : await fetch(url, { method: 'PUT', body: JSON.stringify(value) });
      if (!res.ok) throw new Error('Vote failed');
      return;
    }
    const votes = readLocal(LOCAL_VOTES_KEY, {});
    votes[id] = votes[id] || {};
    if (value === 0) delete votes[id][voterId];
    else votes[id][voterId] = value;
    try { localStorage.setItem(LOCAL_VOTES_KEY, JSON.stringify(votes)); } catch (e) { throw new Error('Vote failed'); }
  }

  /* ---------- Submit box ---------- */
  const textarea = document.getElementById('submit-text');
  const submitBtn = document.getElementById('submit-btn');
  const statusEl = document.getElementById('submit-status');
  const charCount = document.getElementById('char-count');
  let lastSubmit = 0;

  textarea.addEventListener('input', function () {
    charCount.textContent = textarea.value.length + ' / ' + MAX_LENGTH;
  });

  submitBtn.addEventListener('click', async function () {
    const text = textarea.value.trim();
    if (!text) {
      statusEl.textContent = 'write something first!';
      return;
    }
    const wait = COOLDOWN_MS - (Date.now() - lastSubmit);
    if (wait > 0) {
      statusEl.textContent = 'slow down, wait ' + Math.ceil(wait / 1000) + 's';
      return;
    }

    submitBtn.disabled = true;
    statusEl.textContent = 'sending...';
    try {
      await saveSubmission(text.slice(0, MAX_LENGTH));
      lastSubmit = Date.now();
      textarea.value = '';
      charCount.textContent = '0 / ' + MAX_LENGTH;
      statusEl.textContent = 'sent!';
    } catch (e) {
      statusEl.textContent = 'something went wrong, try again';
    }
    submitBtn.disabled = false;
  });

  /* ---------- View switching ---------- */
  const mainView = document.getElementById('main-view');
  const subView = document.getElementById('submissions-view');
  const subList = document.getElementById('submissions-list');
  const tabZone = document.getElementById('tab-zone');

  let currentList = [];
  let sortMode = 'top';

  function paintVote(s) {
    s._els.score.textContent = s.score;
    s._els.up.classList.toggle('active', s.myVote === 1);
    s._els.down.classList.toggle('active', s.myVote === -1);
  }

  async function castVote(s, value) {
    if (s.pending) return;
    const prevVote = s.myVote;
    const prevScore = s.score;
    const next = prevVote === value ? 0 : value;
    s.score += next - prevVote;
    s.myVote = next;
    s.pending = true;
    paintVote(s);
    try {
      await saveVote(s.id, next);
    } catch (e) {
      s.myVote = prevVote;
      s.score = prevScore;
      paintVote(s);
    }
    s.pending = false;
  }

  function renderList() {
    subList.textContent = '';
    if (currentList.length === 0) {
      const empty = document.createElement('div');
      empty.id = 'submissions-empty';
      empty.textContent = 'nothing here yet';
      subList.appendChild(empty);
      return;
    }

    currentList.sort(function (a, b) {
      if (sortMode === 'top' && b.score !== a.score) return b.score - a.score;
      return (b.time || 0) - (a.time || 0);
    });

    currentList.forEach(function (s) {
      const card = document.createElement('div');
      card.className = 'submission';

      const col = document.createElement('div');
      col.className = 'vote-col';
      const up = document.createElement('button');
      up.type = 'button';
      up.className = 'vote-btn';
      up.textContent = '\u25B2';
      up.setAttribute('aria-label', 'upvote');
      const score = document.createElement('div');
      score.className = 'vote-score';
      const down = document.createElement('button');
      down.type = 'button';
      down.className = 'vote-btn';
      down.textContent = '\u25BC';
      down.setAttribute('aria-label', 'downvote');
      col.appendChild(up);
      col.appendChild(score);
      col.appendChild(down);

      const body = document.createElement('div');
      body.className = 'submission-body';

      const t = document.createElement('div');
      t.className = 'submission-text';
      t.textContent = s.text;

      const when = document.createElement('div');
      when.className = 'submission-time';
      when.textContent = s.time ? new Date(s.time).toLocaleString() : '';

      body.appendChild(t);
      body.appendChild(when);
      card.appendChild(col);
      card.appendChild(body);
      subList.appendChild(card);

      s._els = { up: up, down: down, score: score };
      paintVote(s);
      up.addEventListener('click', function () { castVote(s, 1); });
      down.addEventListener('click', function () { castVote(s, -1); });
    });
  }

  document.querySelectorAll('.sort-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      sortMode = btn.dataset.sort;
      document.querySelectorAll('.sort-btn').forEach(function (b) {
        b.classList.toggle('active', b === btn);
      });
      renderList();
    });
  });

  async function showSubmissions() {
    mainView.hidden = true;
    tabZone.hidden = true;
    subView.hidden = false;
    window.scrollTo(0, 0);

    subList.textContent = '';
    const loading = document.createElement('div');
    loading.id = 'submissions-empty';
    loading.textContent = 'loading...';
    subList.appendChild(loading);

    try {
      currentList = await loadSubmissions();
    } catch (e) {
      loading.textContent = "couldn't load submissions";
      return;
    }
    renderList();
  }

  function showMain() {
    subView.hidden = true;
    mainView.hidden = false;
    tabZone.hidden = false;
    window.scrollTo(0, 0);
  }

  document.getElementById('submissions-tab').addEventListener('click', showSubmissions);
  document.getElementById('back-btn').addEventListener('click', showMain);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !subView.hidden) showMain();
  });
</script>

</body>
</html>
