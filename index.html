<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>toast</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    background-color: #000000;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    position: relative;
  }

  body > *:not(.click-ripple):not(.click-dot) {
    position: relative;
    z-index: 1;
  }

  #soundcloud-link img {
    width: 100px;
    transition: transform 0.1s ease-out;
  }

  #soundcloud-link img.clicked {
    transform: scale(1.1);
    transition: transform 0.1s ease-out;
  }

  #soundcloud-link img.reset {
    transform: scale(1);
    transition: transform 0.4s ease-out;
  }

  #who-is-toast {
    color: #ffffff;
    margin-top: 16px;
    font-size: 18px;
    font-weight: 400;
    cursor: pointer;
    transition: font-weight 0.15s ease-out;
  }

  #who-is-toast:hover {
    font-weight: 700;
  }

  #newest-release {
    margin-top: 40px;
    text-align: center;
    color: #ffffff;
  }

  #newest-release-label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #b3b3b3;
    margin-bottom: 10px;
  }

  #newest-release a {
    text-decoration: none;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #newest-release img {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
    transition: transform 0.2s ease-out;
  }

  #newest-release a:hover img {
    transform: scale(1.05);
  }

  #newest-release-title {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 400;
    transition: font-weight 0.15s ease-out;
  }

  #newest-release a:hover #newest-release-title {
    font-weight: 700;
  }

  .click-ripple {
    position: fixed;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #b84dd6;
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.8;
    pointer-events: none;
    z-index: 2;
    animation: rippleExpand 0.6s ease-out forwards;
  }

  @keyframes rippleExpand {
    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(12); opacity: 0; }
  }

  .click-dot {
    position: fixed;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #b84dd6;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
  }
</style>
</head>
<body>

<a href="https://soundcloud.com/toast_03" target="_blank" rel="noopener noreferrer" id="soundcloud-link">
  <img src="soundcloudicon.png" alt="SoundCloud" id="soundcloud-img">
</a>

<p id="who-is-toast">who is toast</p>

<!-- ====== EDIT THIS BLOCK EACH TIME YOU DROP A NEW SONG ====== -->
<div id="newest-release">
  <div id="newest-release-label">Newest Release</div>
  <a href="https://open.spotify.com/track/REPLACE_WITH_TRACK_ID" target="_blank" rel="noopener noreferrer">
    <img src="juniorhigh.png" alt="Newest release cover art">
    <div id="newest-release-title">Junior High</div>
  </a>
</div>
<!-- ============================================================ -->

<script>
  const link = document.getElementById('soundcloud-link');
  const img = document.getElementById('soundcloud-img');

  link.addEventListener('click', function (e) {
    e.preventDefault();

    img.classList.remove('reset');
    img.classList.add('clicked');

    setTimeout(() => {
      img.classList.remove('clicked');
      img.classList.add('reset');
    }, 100);

    setTimeout(() => {
      window.open(link.href, '_blank', 'noopener,noreferrer');
    }, 500);
  });

  const toastText = document.getElementById('who-is-toast');
  toastText.addEventListener('click', function () {
    window.open('https://linktr.ee/toastW', '_blank', 'noopener,noreferrer');
  });

  document.addEventListener('click', function (e) {
    const ripple = document.createElement('div');
    ripple.className = 'click-ripple';
    ripple.style.left = e.clientX + 'px';
    ripple.style.top = e.clientY + 'px';
    document.body.appendChild(ripple);
    ripple.addEventListener('animationend', function () {
      ripple.remove();
    });
  });

  function placeDot(x, y) {
    const dot = document.createElement('div');
    dot.className = 'click-dot';
    dot.style.left = x + 'px';
    dot.style.top = y + 'px';
    document.body.appendChild(dot);
  }

  let isDragging = false;
  let lastX = 0;
  let lastY = 0;
  const dotSpacing = 14;

  document.addEventListener('mousedown', function (e) {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    placeDot(e.clientX, e.clientY);
  });

  document.addEventListener('mousemove', function (e) {
    if (!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    if (Math.sqrt(dx * dx + dy * dy) >= dotSpacing) {
      placeDot(e.clientX, e.clientY);
      lastX = e.clientX;
      lastY = e.clientY;
    }
  });

  document.addEventListener('mouseup', function () {
    isDragging = false;
  });
</script>

</body>
</html>
