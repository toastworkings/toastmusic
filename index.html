<style>
  body {
  background: linear-gradient(to bottom, #6a0dad, #000000);
  margin: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: 'Poppins', sans-serif;
  }
  body {
    background-color: #000000;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
  }

  #soundcloud-link img {
    width: 100px;
    transition: transform 0.1s ease-out;
  }

  #soundcloud-link img.clicked {
    transform: scale(1.1);
    transition: transform 0.1s ease-out;
  }

  #soundcloud-link img.reset {
    transform: scale(1);
    transition: transform 0.4s ease-out;
  }

  #who-is-toast {
    color: #ffffff;
    margin-top: 16px;
    font-size: 18px;
    font-weight: 400;
    cursor: pointer;
    transition: font-weight 0.15s ease-out;
  }

  #who-is-toast:hover {
    font-weight: 700;
  }

  /* --- Newest Release section --- */
  #newest-release {
    margin-top: 40px;
    text-align: center;
    color: #ffffff;
  }

  #newest-release-label {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #b3b3b3;
    margin-bottom: 10px;
  }

  #newest-release a {
    text-decoration: none;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #newest-release img {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
    transition: transform 0.2s ease-out;
  }

  #newest-release a:hover img {
    transform: scale(1.05);
  }

  #newest-release-title {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 400;
    transition: font-weight 0.15s ease-out;
  }

  #newest-release a:hover #newest-release-title {
    font-weight: 700;
  }
</style>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

<a href="https://soundcloud.com/toast_03" target="_blank" rel="noopener noreferrer" id="soundcloud-link">
  <img src="soundcloudicon.png" alt="SoundCloud" id="soundcloud-img">
</a>

<p id="who-is-toast">who is toast</p>

<!-- ====== EDIT THIS BLOCK EACH TIME YOU DROP A NEW SONG ====== -->
<div id="newest-release">
  <div id="newest-release-label">Newest Release</div>
  <a href="https://open.spotify.com/track/1N1Rhy4bHauOqLzUMPr394?si=5d35e5ce41e9480f" target="_blank" rel="noopener noreferrer">
    <img src="juniorhigh.png" alt="Newest release cover art">
    <div id="newest-release-title">Junior High</div>
  </a>
</div>
<!-- ============================================================ -->

<script>
  const link = document.getElementById('soundcloud-link');
  const img = document.getElementById('soundcloud-img');

  link.addEventListener('click', function (e) {
    e.preventDefault();

    img.classList.remove('reset');
    img.classList.add('clicked');

    setTimeout(() => {
      img.classList.remove('clicked');
      img.classList.add('reset');
    }, 100);

    setTimeout(() => {
      window.open(link.href, '_blank', 'noopener,noreferrer');
    }, 500);
  });

  const toastText = document.getElementById('who-is-toast');
  toastText.addEventListener('click', function () {
    window.open('https://linktr.ee/toastW', '_blank', 'noopener,noreferrer');
  });
</script>
