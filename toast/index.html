<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toast</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
  (function () {
    try { if (localStorage.getItem('toast_theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
  })();
</script>
<style>
  :root {
    --page: #000000;
    --ui-bg: #151515;
    --ui-border: #333333;
    --ui-fg: #ffffff;
    --ui-hover: #222222;
  }
  :root[data-theme="light"] {
    --page: #ffffff;
    --ui-bg: #f3f3f5;
    --ui-border: #d4d4da;
    --ui-fg: #141416;
    --ui-hover: #e6e6ea;
  }
  :root {
    --card: #74245e;
    --blob: #5a1b4a;
    --btn: #2b0c27;
    --btn-hover: #3a1535;
  }
  * { box-sizing: border-box; }
  html { background: var(--page); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 580px;
    min-height: 100vh;
    margin-top: 38px;
    padding: 56px 28px 60px;
    background-color: var(--card);
    overflow: hidden;
    border-radius: 28px 28px 0 0;
    text-align: center;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400' viewBox='0 0 400 400'><g fill='%235a1b4a'><g id='a'><ellipse cx='70' cy='60' rx='62' ry='46'/><ellipse cx='260' cy='130' rx='48' ry='70'/><ellipse cx='120' cy='260' rx='70' ry='50'/><ellipse cx='320' cy='320' rx='56' ry='62'/><circle cx='200' cy='20' r='30'/><circle cx='370' cy='210' r='26'/><circle cx='30' cy='370' r='34'/></g><use href='%23a' x='-400'/><use href='%23a' x='400'/><use href='%23a' y='-400'/><use href='%23a' y='400'/><use href='%23a' x='-400' y='-400'/><use href='%23a' x='400' y='-400'/><use href='%23a' x='-400' y='400'/><use href='%23a' x='400' y='400'/></g></svg>");
    background-size: 400px 400px;
    animation: drift 70s linear infinite;
    pointer-events: none;
  }
  .card > * { position: relative; }
  @keyframes drift { to { background-position: 400px 400px; } }
  @media (prefers-reduced-motion: reduce) { .card::before { animation: none; } }

  .roll { opacity: 0; }

  .pfp {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    background: #fff;
    display: block;
    margin: 0 auto;
  }
  .handle { margin: 16px 0 0; font-size: 24px; font-weight: 700; display: none; }
  .bio { margin: 14px 0 0; font-size: 16px; font-weight: 600; }

  .socials {
    margin: 22px 0 36px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 16px;
  }
  .socials a {
    color: #fff;
    font-size: 30px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.18s ease-out, opacity 0.18s;
  }
  .socials a:hover { transform: scale(1.18); }

  .links { display: flex; flex-direction: column; gap: 14px; }
  .link {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 64px;
    padding: 8px 64px;
    background: var(--btn);
    color: #fff;
    border-radius: 32px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.18s ease-out, background 0.18s ease-out;
  }
  .link:hover { background: var(--btn-hover); transform: scale(1.025); }
  .link img {
    position: absolute;
    left: 8px;
    top: 8px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
  }

  .ui-btn {
    position: fixed;
    top: 16px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 14px;
    background: var(--ui-bg);
    color: var(--ui-fg);
    border: 1px solid var(--ui-border);
    border-radius: 10px;
    font: 600 14px 'Poppins', sans-serif;
    text-decoration: none;
    cursor: pointer;
    z-index: 20;
    transition: background 0.15s ease-out;
  }
  .ui-btn:hover { background: var(--ui-hover); }
  #back { left: 16px; }
  #gear { right: 16px; width: 40px; padding: 0; font-size: 18px; }
  #gear i { transition: transform 0.4s ease-out; }
  #gear:hover i { transform: rotate(60deg); }
  #panel {
    position: fixed;
    top: 64px;
    right: 16px;
    width: 190px;
    padding: 12px;
    background: var(--ui-bg);
    color: var(--ui-fg);
    border: 1px solid var(--ui-border);
    border-radius: 12px;
    z-index: 20;
    display: none;
    font-size: 13px;
  }
  #panel.open { display: block; }
  #panel .lbl { margin: 0 0 8px; opacity: 0.7; }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1;
    padding: 8px 0;
    background: transparent;
    color: var(--ui-fg);
    border: 1px solid var(--ui-border);
    border-radius: 8px;
    font: 600 13px 'Poppins', sans-serif;
    cursor: pointer;
  }
  .seg button.on { background: var(--ui-fg); color: var(--page); }

  @media (max-width: 620px) {
    .card { margin-top: 0; border-radius: 0; padding-top: 48px; }
  }
</style>
</head>
<body>

<a id="back" class="ui-btn" href="../"><i class="fa-solid fa-arrow-left"></i> back</a>
<button id="gear" class="ui-btn" aria-label="Settings"><i class="fa-solid fa-gear"></i></button>
<div id="panel">
  <p class="lbl">Theme</p>
  <div class="seg"><button id="t-dark">Dark</button><button id="t-light">Light</button></div>
</div>

<main class="card">
  <img class="pfp roll" src="pfp.png" alt="Toast">

  <p class="bio roll">VGM artist!!</p>

  <nav class="socials roll">
    <a href="https://open.spotify.com/artist/1LVkmxubewjyPnMDTd29on" target="_blank" rel="noopener noreferrer" aria-label="Spotify"><i class="fa-brands fa-spotify"></i></a>
    <a href="https://www.youtube.com/@ToastSC" target="_blank" rel="noopener noreferrer" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
    <a href="https://soundcloud.com/toast_03" target="_blank" rel="noopener noreferrer" aria-label="SoundCloud"><i class="fa-brands fa-soundcloud"></i></a>
    <a href="https://www.tiktok.com/@toastsians" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
    <a href="https://music.apple.com/us/artist/toastw/1863226687" target="_blank" rel="noopener noreferrer" aria-label="Apple Music"><i class="fa-brands fa-itunes-note"></i></a>
    <a href="https://discord.com/invite/nGv53p79jp" target="_blank" rel="noopener noreferrer" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
  </nav>

  <div class="links">
    <a class="link roll" href="https://soundcloud.com/toast_03" target="_blank" rel="noopener noreferrer">
      <img src="SCI.jpg" alt=""><span>Soundcloud</span>
    </a>
    <a class="link roll" href="https://open.spotify.com/artist/1LVkmxubewjyPnMDTd29on" target="_blank" rel="noopener noreferrer">
      <img src="SICON.png" alt=""><span>Spotify</span>
    </a>
    <a class="link roll" href="https://www.tiktok.com/@toastsians" target="_blank" rel="noopener noreferrer">
      <img src="TICON.png" alt=""><span>Tiktok</span>
    </a>
    <a class="link roll" href="https://www.youtube.com/@ToastSC" target="_blank" rel="noopener noreferrer">
      <img src="YCON.png" alt=""><span>YouTube</span>
    </a>
  </div>
</main>

<script>
  var root = document.documentElement, panel = document.getElementById('panel');
  function setTheme(t) {
    if (t === 'light') root.setAttribute('data-theme', 'light'); else root.removeAttribute('data-theme');
    document.getElementById('t-dark').classList.toggle('on', t !== 'light');
    document.getElementById('t-light').classList.toggle('on', t === 'light');
    try { localStorage.setItem('toast_theme', t); } catch (e) {}
  }
  setTheme(root.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
  document.getElementById('t-dark').onclick = function () { setTheme('dark'); };
  document.getElementById('t-light').onclick = function () { setTheme('light'); };
  document.getElementById('gear').onclick = function (e) { e.stopPropagation(); panel.classList.toggle('open'); };
  document.addEventListener('click', function (e) { if (!panel.contains(e.target)) panel.classList.remove('open'); });

  /* everything rolls up from the bottom of the page, top items fastest, lower ones slower */
  (function () {
    var items = document.querySelectorAll('.roll');
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var ease = 'cubic-bezier(0.22, 1, 0.36, 1)';
    items.forEach(function (el, i) {
      if (reduce) { el.style.opacity = 1; return; }
      var dist = Math.max(window.innerHeight - el.getBoundingClientRect().top, 200) + 40;
      var a = el.animate([
        { transform: 'translateY(' + dist + 'px)', opacity: 0, easing: ease },
        { transform: 'translateY(0)', opacity: 1 }
      ], { duration: 800 + i * 220, delay: i * 40, easing: 'linear', fill: 'both' });
      a.onfinish = function () { el.style.opacity = 1; a.cancel(); };
    });
  })();
</script>
</body>
</html>
